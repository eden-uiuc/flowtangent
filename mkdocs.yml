site_name: FlowTangent
site_description: A differentiable, GPU-accelerated aerospace systems design environment.
theme:
  name: material
  palette:
    scheme: slate      # Forces dark mode
    primary: custom    # Tells MkDocs to look at our CSS for the primary color
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    # - toc.integrate
    - toc.follow
    - content.code.copy

extra_css:
  - stylesheets/nord-theme.css
  
plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: ["src"]
          options:
            # Fixes ToC hierarchy by explicitly rendering the class name as a header
            show_root_heading: true
            show_root_toc_entry: true
            
            # Fixes missing dataclass/module fields by showing them even without docstrings
            show_signature_annotations: true
            
            # Best practice: Combines the __init__ signature docs with the main class docs
            merge_init_into_class: true
            separate_signature: true

            show_symbol_type_heading: true
            show_symbol_type_toc: true

            filters: ["!^_"]

            extensions:
              - docs/hooks/autodoc.py
  - mkdocs-jupyter:
      execute: false 
      theme: dark 
      include_source: true 
      ignore: ["*.ipynb_checkpoints/*"]
      
nav:
  - Home: index.md
  - Tutorials:
      - Quickstart: tutorials/quickstart.ipynb
      - VORJAX: tutorials/VORJAX.ipynb
  - API Reference:
      - Processes: api/processes.md
      - Components: api/components.md
      - Design Space: api/design_space.md


markdown_extensions:
  - toc:
        permalink: true
        toc_depth: 1-2
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/cytoscape-renderer.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js
  - https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.min.js