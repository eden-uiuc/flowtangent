name: FlowTangent CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write 

jobs:
  test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      
      - name: Install package and dev groups
        run: uv pip install --system -e . --group dev

      - name: Enforce Formatting (Ruff)
        run: uv ruff format --check .

      - name: Lint (Ruff)
        # Natively injects inline comments into the PR diff
        run: uv ruff check --output-format=github .

      # - name: Type Check (Pyright)
      #   run: pyright src/flowtangent

      - name: Run Tests (Pytest)
        run: pytest