name: Deploy Documentation

on:
  push:
    branches: [main]

# 1. Default to read-only for the entire workflow
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # JOB 1: Build (Read-only environment, safe for running Python code)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      
      - name: Install dependencies
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf  # v3
        with:
          enable-cache: true
          
      - name: Build documentation
        run: |
          uv sync --group docs
          uv run mkdocs build
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: 'site/'

  # JOB 2: Deploy (Has write permissions, but executes NO Python code)
  deploy:
    needs: build  # Forces this job to wait for the build job to finish
    
    # 2. Grant write permissions ONLY to this specific job
    permissions:
      pages: write
      id-token: write
      
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4