name: FlowTangent CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write 

jobs:
  test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install pyright

      - name: Enforce Formatting (Ruff)
        run: ruff format --check .

      - name: Lint (Reviewdog + Ruff)
        # This action automatically intercepts Ruff's output and posts it to the PR
        uses: reviewdog/action-ruff@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          ruff_flags: "--check ."
          fail_on_error: true

      - name: Type Check (Pyright)
        run: pyright src/flowtangent

      - name: Run Tests (Pytest)
        run: pytest