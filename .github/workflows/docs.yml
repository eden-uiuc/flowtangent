name: Publish Docs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    name: Build & Deploy MkDocs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # 1. Prevent the token from being written to .git/config
          persist-credentials: false  

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # 2. Use uv to correctly install the [dependency-groups] block
        run: uv sync --group docs

      - name: Deploy to GitHub Pages
        env:
          # 3. Expose the token only to this specific step
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 4. Inject the token into the origin URL immediately before pushing
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          uv run mkdocs gh-deploy --force