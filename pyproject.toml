[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowtangent"
version = "0.1.0"
description = "A differentiable, GPU-accelerated aerospace systems design environment."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "equinox",
    "jax",
    "matplotlib",
    "networkx",
    "numcodecs",
    "numpy",
    "optimistix",
    "pandas",
    "plotly",
    "scikit-learn",
    "scipy",
    "tqdm",
    "zarr"
]

[project.optional-dependencies]
dev = [
    "openmdao",
    "pycycle",
    "pytest",
    "nvidia-ml-py",
    "om-pycycle",
    "ruff"
]

[tool.ruff]
# Scientific codebases often need longer lines for complex equations
line-length = 120 

# Python 3.12 as the minimum
target-version = "py312"

[tool.ruff.lint]
# Which rule sets to enable
select = [
    "E",   # pycodestyle errors (spacing, indentation)
    "W",   # pycodestyle warnings
    "F",   # pyflakes (bugs, unused imports, undefined variables)
    "I",   # isort (automatically sorts your imports alphabetically)
    "N",   # pep8-naming (checks variable and class names)
    "NPY", # Numpy checks (function deprecation, legacy aliases)
    "PD",  # Pandas checks
]

# Which specific rules to turn off
ignore = [
    # Scientific code often uses single letters like 'I', 'O', or 'l'
    "E741", 
    # Math heavily relies on capital letters for matrices and thermodynamic states (PR, Wc, T_t).
    # These rules force all variables and functions to be lowercase, which ruins math readability.
    "N802",
    "N803", 
    "N806",
    "N999"
]

[tool.ruff.format]
# Use double quotes for strings (standard Python convention)
quote-style = "double"
# Indent with 4 spaces
indent-style = "space"

[tool.ruff.lint.isort]
# Import block order
section-order = [
    "future",
    "standard-library",   # Native Python (os, sys, etc.)
    "third-party",        # Non-FT packages (jax, equinox, numpy, etc.)
    "first-party",        # FT imports
    "local-folder"        # Relative imports (e.g., from . import utils)
]

# Catch numpy tracer errors (Brilliant addition, by the way)
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"numpy".msg = "Use jax.numpy as jnp in all computational modules to prevent XLA tracer crashes"

[tool.ruff.lint.per-file-ignores]
# __init__.py files are designed to re-export modules. 
# Ignore unused imports (F401) and import sorting (I) globally.
"__init__.py" = ["F401", "I","E402"]